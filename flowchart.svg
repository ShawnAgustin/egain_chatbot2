<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 1024" role="img" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>Lost package chatbot conversation flow</title>
<desc>Decision tree beginning with an order number request, validating format and lookup, triaging tracking status into three branches, and ending in a close-out, a claim, or a human agent handoff. Yes paths exit the bottom-left of each decision diamond; no paths exit the bottom-right.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<g fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5">
<rect x="230" y="20" width="220" height="44" rx="8"/>
<rect x="250" y="876" width="180" height="56" rx="8"/>
<rect x="460" y="960" width="180" height="44" rx="8"/>
</g>
<text x="340" y="42" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Ask for order number</text>
<text x="340" y="896" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Close out</text>
<text x="340" y="914" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">offer new lookup</text>
<text x="550" y="982" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Agent handoff</text>

<g fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5">
<path d="M340 100 L450 142 L340 184 L230 142 Z"/>
<path d="M340 230 L450 272 L340 314 L230 272 Z"/>
<path d="M340 356 L460 402 L340 448 L220 402 Z"/>
<path d="M130 590 L215 628 L130 666 L45 628 Z"/>
<path d="M550 590 L635 628 L550 666 L465 628 Z"/>
</g>
<text x="340" y="142" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#26215C">Valid format?</text>
<text x="340" y="272" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#26215C">Order found?</text>
<text x="340" y="402" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#26215C">Tracking status?</text>
<text x="130" y="628" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#26215C">Found it?</text>
<text x="550" y="628" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#26215C">File a claim?</text>

<g fill="#FAECE7" stroke="#993C1D" stroke-width="0.5">
<rect x="512" y="177" width="150" height="56" rx="8"/>
<rect x="512" y="307" width="150" height="56" rx="8"/>
</g>
<text x="587" y="197" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#4A1B0C">Bad format</text>
<text x="587" y="215" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">retry or agent</text>
<text x="587" y="327" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#4A1B0C">Not found</text>
<text x="587" y="345" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">retry or agent</text>

<g fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5">
<rect x="40" y="500" width="180" height="56" rx="8"/>
<rect x="250" y="500" width="180" height="56" rx="8"/>
<rect x="460" y="500" width="180" height="56" rx="8"/>
<rect x="250" y="600" width="180" height="56" rx="8"/>
<rect x="40" y="708" width="180" height="44" rx="8"/>
<rect x="40" y="798" width="180" height="44" rx="8"/>
</g>
<text x="130" y="520" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Ask: looked around?</text>
<text x="130" y="538" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">porch, neighbors</text>
<text x="340" y="520" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">In transit</text>
<text x="340" y="538" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">show last scan + ETA</text>
<text x="550" y="520" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Past due date</text>
<text x="550" y="538" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">treat as lost</text>
<text x="340" y="620" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Notify on arrival</text>
<text x="340" y="638" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">or new lookup</text>
<text x="130" y="730" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Open lost claim</text>
<text x="130" y="820" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Case created</text>

<g fill="none" stroke="#73726C" stroke-width="1.5">
<path d="M340 64 V94" marker-end="url(#arrow)"/>
<path d="M220 402 H130 V490" marker-end="url(#arrow)"/>
<path d="M340 448 V490" marker-end="url(#arrow)"/>
<path d="M460 402 H550 V490" marker-end="url(#arrow)"/>
<path d="M130 556 V582" marker-end="url(#arrow)"/>
<path d="M340 556 V592" marker-end="url(#arrow)"/>
<path d="M550 556 V582" marker-end="url(#arrow)"/>
<path d="M340 656 V870" marker-end="url(#arrow)"/>
<path d="M130 752 V790" marker-end="url(#arrow)"/>
<path d="M130 842 V890 H242" marker-end="url(#arrow)"/>
<path d="M662 205 H672"/>
<path d="M662 335 H672 V42 H458" marker-end="url(#arrow)"/>
</g>
<circle cx="672" cy="205" r="3" fill="#73726C"/>
<text x="560" y="32" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">retry</text>

<g fill="none" stroke="#639922" stroke-width="2.5">
<path d="M285 163 V245" marker-end="url(#arrow)"/>
<path d="M285 293 V371" marker-end="url(#arrow)"/>
<path d="M88 647 H25 V915 H242" marker-end="url(#arrow)"/>
<path d="M508 647 V730 H228" marker-end="url(#arrow)"/>
</g>
<g fill="none" stroke="#D85A30" stroke-width="2.5">
<path d="M395 163 V205 H506" marker-end="url(#arrow)"/>
<path d="M395 293 V335 H506" marker-end="url(#arrow)"/>
<path d="M172 647 V702" marker-end="url(#arrow)"/>
<path d="M592 647 H665 V904 H436" marker-end="url(#arrow)"/>
</g>

<g font-size="13" font-weight="500" dominant-baseline="central">
<text x="279" y="182" text-anchor="end" fill="#3B6D11">Yes</text>
<text x="401" y="182" text-anchor="start" fill="#993C1D">No</text>
<text x="279" y="312" text-anchor="end" fill="#3B6D11">Yes</text>
<text x="401" y="312" text-anchor="start" fill="#993C1D">No</text>
<text x="82" y="666" text-anchor="end" fill="#3B6D11">Yes</text>
<text x="178" y="666" text-anchor="start" fill="#993C1D">No</text>
<text x="502" y="666" text-anchor="end" fill="#3B6D11">Yes</text>
<text x="598" y="666" text-anchor="start" fill="#993C1D">No</text>
</g>

<g font-size="12" dominant-baseline="central" fill="#5F5E5A">
<text x="138" y="440" text-anchor="start">Delivered, missing</text>
<text x="348" y="470" text-anchor="start">In transit</text>
<text x="470" y="440" text-anchor="start">Past due</text>
</g>

<path d="M230 42 H8 V982 H454" fill="none" stroke="#73726C" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="200" y="970" text-anchor="start" dominant-baseline="central" font-size="12" fill="#5F5E5A">"agent" at any time</text>
</svg>
