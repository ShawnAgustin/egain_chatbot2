<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 650" role="img" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>TrackBot's agentic AI workflow</title>
<desc>Loop diagram: a customer message enters Gemini, which identifies intent by picking one move from a security layer that only offers moves legal at the current step. The engine then retrieves and enriches data — looking up the order and building a draft reply from real facts. Gemini's decision layer then rewords that draft, keeping it only if the facts still match. The turn ends in one of three outcomes: resolution, where the chat ends; follow-up, which loops back to a new customer message; or escalation, where a person is offered.</desc>
<defs>
<marker id="awf-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<g fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5">
<rect x="240" y="16" width="200" height="44" rx="8"/>
</g>
<text x="340" y="38" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Customer message</text>

<g fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5">
<rect x="170" y="96" width="340" height="60" rx="8"/>
</g>
<text x="340" y="116" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#26215C">Gemini: identify intent</text>
<text x="340" y="136" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#4B4699">security layer — only moves legal at this step are offered</text>

<g fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5">
<rect x="170" y="192" width="340" height="60" rx="8"/>
</g>
<text x="340" y="212" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Engine: retrieve data</text>
<text x="340" y="232" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">looks up the order, builds a draft reply from real facts</text>

<g fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5">
<rect x="170" y="288" width="340" height="60" rx="8"/>
</g>
<text x="340" y="308" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#26215C">Gemini: decision layer</text>
<text x="340" y="328" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#4B4699">rewords the draft — kept only if the facts still match</text>

<path d="M340 398 L432 442 L340 486 L248 442 Z" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="442" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#26215C">Outcome?</text>

<g fill="none" stroke="#73726C" stroke-width="1.5">
<path d="M340 60 V90" marker-end="url(#awf-arrow)"/>
<path d="M340 156 V186" marker-end="url(#awf-arrow)"/>
<path d="M340 252 V282" marker-end="url(#awf-arrow)"/>
<path d="M340 348 V392" marker-end="url(#awf-arrow)"/>
<path d="M340 486 V536" marker-end="url(#awf-arrow)"/>
</g>
<g fill="none" stroke="#639922" stroke-width="2.5">
<path d="M290 466 L120 520 V536" marker-end="url(#awf-arrow)"/>
</g>
<g fill="none" stroke="#D85A30" stroke-width="2.5">
<path d="M390 466 L560 520 V536" marker-end="url(#awf-arrow)"/>
</g>

<g fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5">
<rect x="20" y="538" width="200" height="78" rx="8"/>
</g>
<text x="120" y="560" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#20390A">Resolution</text>
<text x="120" y="580" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3B6D11">claim opened, found it,</text>
<text x="120" y="596" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3B6D11">cancelled — chat ends</text>

<g fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5">
<rect x="240" y="538" width="200" height="78" rx="8"/>
</g>
<text x="340" y="560" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Follow-up</text>
<text x="340" y="580" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">conversation continues,</text>
<text x="340" y="596" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">loops back to the top</text>

<g fill="#FAECE7" stroke="#993C1D" stroke-width="0.5">
<rect x="460" y="538" width="200" height="78" rx="8"/>
</g>
<text x="560" y="560" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#4A1B0C">Escalation</text>
<text x="560" y="580" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">upset x2, 3 misses,</text>
<text x="560" y="596" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">profanity, or asked directly</text>

<path d="M340 616 V628 H8 V38 H236" fill="none" stroke="#73726C" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#awf-arrow)"/>
<text x="120" y="26" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">follow-up</text>
</svg>
