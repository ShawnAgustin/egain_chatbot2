# OPTIONAL. Only needed if you host the chat page on GitHub Pages and the
# agent server somewhere else. If you deploy to Render, you don't need this.
#
# Runs only when you start it by hand (Actions tab → Publish chat page → Run),
# so it can't fail on every push and put a red ✗ on your repo.
# One-time setup first: repo Settings → Pages → Source: "GitHub Actions".
name: Publish chat page

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
