<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrackBot — lost package assistant</title>
<style>
  :root{
    --ink:#1f2430; --muted:#6b6f7a; --paper:#f4f2ed; --panel:#fff;
    --line:#ddd9cf; --navy:#243350; --amber:#c97b2e; --amber-dk:#a6621f;
    --bot:#eceff5; --err:#fbeae4; --err-ink:#7c3317;
  }
  *{box-sizing:border-box}
  body{
    margin:0; padding:28px 16px; min-height:100vh; display:flex; justify-content:center;
    background:var(--paper); color:var(--ink);
    font:15px/1.55 "Iowan Old Style","Palatino Linotype",Georgia,serif;
  }
  .wrap{width:100%; max-width:580px}
  h1{margin:0; font-size:22px; letter-spacing:-.02em; color:var(--navy)}
  .sub{margin:4px 0 18px; font-size:13.5px; color:var(--muted)}
  .panel{background:var(--panel); border:1px solid var(--line); border-radius:16px; overflow:hidden;
         box-shadow:0 1px 2px rgba(36,51,80,.06), 0 10px 28px rgba(36,51,80,.08)}
  .bar{background:var(--navy); color:var(--paper); padding:13px 18px; display:flex; align-items:center; gap:9px; font-size:13.5px}
  .led{width:8px; height:8px; border-radius:50%; background:#74c08e; box-shadow:0 0 0 3px rgba(116,192,142,.25)}
  .mode{margin-left:auto; font:11.5px "Courier New",monospace; padding:3px 8px; border-radius:10px;
        background:rgba(255,255,255,.12); color:#d9dfeb}
  .mode.agent{background:rgba(201,123,46,.28); color:#ffe2c2}
  #thread{height:430px; overflow-y:auto; overflow-x:hidden; padding:18px 22px 10px; display:flex; flex-direction:column; gap:3px; background:var(--panel)}

  /* Chat bubbles. --bubble is the fill; the tail is drawn with two pseudo-elements,
     one in the bubble colour and one in the thread background that carves the curve. */
  .msg{position:relative; max-width:78%; padding:9px 15px; border-radius:19px; font-size:14.5px; line-height:1.45;
       white-space:pre-wrap; overflow-wrap:anywhere; background:var(--bubble); animation:pop .16s ease-out}
  .msg.start{margin-top:11px}
  .bot{--bubble:var(--bot); align-self:flex-start; color:var(--ink)}
  .err{--bubble:var(--err); align-self:flex-start; color:var(--err-ink)}
  .me{--bubble:var(--navy); align-self:flex-end; color:#fff}
  .msg.tail::before, .msg.tail::after{content:""; position:absolute; bottom:0; height:19px}
  .msg.left.tail::before{left:-7px; width:20px; background:var(--bubble); border-bottom-right-radius:16px 14px}
  .msg.left.tail::after{left:-26px; width:26px; background:var(--panel); border-bottom-right-radius:10px}
  .msg.right.tail::before{right:-7px; width:20px; background:var(--bubble); border-bottom-left-radius:16px 14px}
  .msg.right.tail::after{right:-26px; width:26px; background:var(--panel); border-bottom-left-radius:10px}
  @keyframes pop{from{opacity:0; transform:translateY(5px) scale(.98)}to{opacity:1; transform:none}}

  .decision{align-self:flex-end; margin:3px 6px 0 0; font:11.5px "Courier New",monospace; color:var(--muted)}
  .decision b{color:var(--amber-dk); font-weight:600}

  .typing{display:flex; gap:5px; align-items:center; padding:13px 16px}
  .typing i{width:7px; height:7px; border-radius:50%; background:#8b93a5; animation:dot 1.1s infinite ease-in-out}
  .typing i:nth-child(2){animation-delay:.16s}
  .typing i:nth-child(3){animation-delay:.32s}
  @keyframes dot{0%,60%,100%{opacity:.35; transform:none}30%{opacity:1; transform:translateY(-3px)}}
  .sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
  @media (prefers-reduced-motion:reduce){.msg,.typing i{animation:none}}

  #chips{display:flex; flex-wrap:wrap; gap:8px; padding:4px 22px 14px}
  .chip{border:1px solid var(--navy); background:none; color:var(--navy); padding:6px 12px;
        border-radius:20px; font-size:13px; font-family:inherit; cursor:pointer}
  .chip:hover{background:var(--navy); color:var(--paper)}
  form{display:flex; gap:8px; padding:11px 14px; border-top:1px solid var(--line)}
  input{flex:1; border:0; padding:14px 16px; font-size:14.5px; font-family:inherit; background:none; color:var(--ink); outline:none}
  #entry{border:1px solid var(--line); border-radius:22px; padding:10px 17px; background:#faf9f6}
  #entry:focus{border-color:var(--navy); background:#fff}
  button[type=submit]{border:0; background:var(--amber); color:#fff; padding:0 22px; border-radius:22px; font-size:14px; font-family:inherit; cursor:pointer}
  button[type=submit]:hover{background:var(--amber-dk)}
  button:disabled, input:disabled{opacity:.55; cursor:wait}
  .foot{display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin-top:12px; font-size:12.5px; color:var(--muted)}
  .foot label{white-space:nowrap; cursor:pointer}
  code{background:#e9e5da; padding:1px 5px; border-radius:3px; font-family:"Courier New",monospace}
  #thread::-webkit-scrollbar{width:8px}
  #thread::-webkit-scrollbar-thumb{background:var(--line); border-radius:4px}
  body.hide-decisions .decision{display:none}
  .tools{display:flex; gap:16px; align-items:baseline}
  .linkbtn{border:0; background:none; padding:0; font:inherit; color:var(--navy); text-decoration:underline; cursor:pointer; white-space:nowrap}
  .orders{margin-top:12px}
  .orders-head{padding:10px 14px; background:var(--navy); color:var(--paper); font-size:12.5px}
  .orders-note{padding:9px 14px; background:var(--err); color:var(--err-ink); font-size:12.5px; border-bottom:1px solid var(--line)}
  #orderList{max-height:340px; overflow-y:auto}
  .orow{display:flex; gap:12px; width:100%; text-align:left; padding:9px 14px; border:0; border-bottom:1px solid var(--line);
        background:none; font:inherit; color:inherit; cursor:pointer}
  .orow:hover{background:var(--bot)}
  .oleft{display:flex; flex-direction:column; flex:0 0 112px; font:11.5px "Courier New",monospace}
  .oid{font-size:12.5px; font-weight:600; color:var(--navy)}
  .ostatus{color:var(--amber-dk)}
  .oright{display:flex; flex-direction:column; min-width:0}
  .ouse{font-size:13.5px}
  .odet{font:11.5px "Courier New",monospace; color:var(--muted); overflow-wrap:anywhere}
</style>
</head>
<body>
<div class="wrap">
  <h1>TrackBot</h1>
  <p class="sub">A chatbot flow for helping a customer track down a lost package. eGain take-home assignment.</p>

  <div class="panel">
    <div class="bar"><span class="led"></span><span>Lost package assistant</span><span id="mode" class="mode">starting…</span></div>
    <div id="thread" role="log" aria-live="polite"></div>
    <div id="chips"></div>
    <form id="composer">
      <input id="entry" type="text" placeholder="Type a message…" autocomplete="off" aria-label="Message" maxlength="500">
      <button type="submit">Send</button>
    </form>
  </div>

  <div class="foot">
    <span>Try <code>EG-58120</code> · <code>EG-77441</code> · <code>EG-10293</code>, or type <code>agent</code> anytime.</span>
    <span class="tools">
      <button type="button" id="ordersToggle" class="linkbtn" aria-expanded="false" aria-controls="orders">view all orders</button>
      <label><input type="checkbox" id="showDecisions" checked> show agent decisions</label>
    </span>
  </div>

  <div id="orders" class="panel orders" hidden>
    <div class="orders-head" id="ordersHead">All test orders — click one to look it up in the chat</div>
    <div class="orders-note" id="ordersNote" hidden></div>
    <div id="orderList"></div>
  </div>
</div>

<script src="config.js"></script>
<script src="engine.js"></script>
<script>
/* ============================================================
   Front end. Two ways to run:
     - Served by server.js  → every turn goes to /api/chat, where
       Gemini decides and the engine responds.
     - Opened as a file     → the same engine runs right here in
       the browser, with the rule-based matcher deciding.
   Either way the rendering below is identical.
   ============================================================ */

const thread = document.getElementById("thread");
const chips  = document.getElementById("chips");
const form   = document.getElementById("composer");
const entry  = document.getElementById("entry");
const sendBtn = form.querySelector("button");
const modeTag = document.getElementById("mode");

let backend = null;   // { submit(text) -> Promise<reply> }

/* ---------- Rendering ---------- */
// Bubbles are grouped by sender: only the last bubble in a run keeps its tail.
function place(el) {
  const side = el.classList.contains("me") ? "right" : "left";
  const prev = thread.lastElementChild;
  const sameRun = prev && prev.classList.contains("msg") && prev.classList.contains(side);
  if (sameRun) prev.classList.remove("tail");
  el.classList.add("msg", side, "tail");
  el.classList.toggle("start", !sameRun);
  thread.appendChild(el);
  thread.scrollTop = thread.scrollHeight;
}

function add(className, text) {
  const el = document.createElement("div");
  el.className = className;
  el.textContent = text;
  place(el);
  return el;
}

function addTyping() {
  const el = document.createElement("div");
  el.className = "bot typing";
  el.innerHTML = '<i></i><i></i><i></i><span class="sr-only">TrackBot is thinking…</span>';
  place(el);
  return el;
}

function addDecision(d) {
  if (!d) return;
  const el = document.createElement("div");
  el.className = "decision";
  const action = document.createElement("b");
  action.textContent = d.action;
  el.append("→ ", action, ` · ${d.by}` + (d.rejected ? ` (rejected ${d.rejected})` : "") + (d.upset ? " · upset" : ""));
  thread.appendChild(el);
}

function render(reply) {
  reply.messages.forEach(m => add(m.kind === "err" ? "err" : "bot", m.text));
  chips.replaceChildren();
  (reply.chips || []).forEach(label => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chip";
    b.textContent = label;
    b.onclick = () => submit(label);
    chips.appendChild(b);
  });
}

function busy(on) {
  entry.disabled = sendBtn.disabled = on;
  chips.querySelectorAll("button").forEach(b => (b.disabled = on));
}

/* ---------- One customer turn ---------- */
async function submit(raw) {
  const text = raw.trim();
  if (!text || entry.disabled) return;
  add("me", text);
  busy(true);
  const typing = addTyping();
  try {
    const reply = await backend.submit(text);
    typing.remove();
    addDecision(reply.decision);
    render(reply);
  } catch (e) {
    typing.remove();
    add("err", "Something went wrong on my end. Please try again in a moment.");
    console.error(e);
  } finally {
    busy(false);
    entry.focus();
  }
}

form.onsubmit = e => { e.preventDefault(); const v = entry.value; entry.value = ""; submit(v); };
document.getElementById("showDecisions").onchange = e =>
  document.body.classList.toggle("hide-decisions", !e.target.checked);

/* ---------- Backends ---------- */
// Where the agent server lives. "" means the same place this page came from.
const API = String(window.TRACKBOT_API || "").replace(/\/$/, "");

async function serverBackend() {
  // Short timeout: if the agent server is off, fall back to local mode quickly.
  const status = await fetch(API + "/api/status", { signal: AbortSignal.timeout(5000) })
    .then(r => { if (!r.ok) throw new Error("no agent server"); return r.json(); });
  const newSession = () => fetch(API + "/api/session", { method: "POST" }).then(r => r.json());
  const start = await newSession();
  let sessionId = start.sessionId;
  return {
    label: status.agent === "gemini" ? `Gemini agent · ${status.model}` : "server · rule-based",
    agent: status.agent === "gemini",
    greeting: start,
    async submit(text) {
      const r = await fetch(API + "/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sessionId, text }),
        signal: AbortSignal.timeout(20000)
      });
      // Free hosts restart after sleeping, which clears open chats.
      // Rather than show an error, quietly start a fresh conversation.
      if (r.status === 404) {
        const fresh = await newSession();
        sessionId = fresh.sessionId;
        return { messages: [{ kind: "err", text: "That chat timed out while it was idle, so I've started a fresh one." },
                            ...fresh.messages], chips: fresh.chips };
      }
      const data = await r.json();
      if (!r.ok) return { messages: [{ kind: "err", text: data.error || "Request failed." }], chips: [] };
      return data;
    }
  };
}

async function localBackend() {
  const E = window.TrackBotEngine;
  // Opened straight from disk, browsers block this fetch; the engine's built-in sample orders cover that.
  try { const r = await fetch("orders.json"); if (r.ok) E.setOrders(await r.json()); } catch {}
  const s = E.createSession();
  return {
    label: "local · rule-based",
    agent: false,
    greeting: E.greeting(),
    async submit(text) {
      const which = E.precheck(s, text);
      if (which) return { ...which, decision: { action: "which_order", by: "rules" } };
      const d = E.ruleIntent(s, text) || { action: "unclear" };
      const reply = E.apply(s, d.action, d.args);
      return { ...reply, decision: { action: d.action, by: "rules" } };
    }
  };
}

/* ---------- Debug: browse every order ---------- */
const ordersToggle = document.getElementById("ordersToggle");
const ordersBox = document.getElementById("orders");
const orderList = document.getElementById("orderList");
let ordersShown = false;

// The server's list first, then the file next to this page, then whatever the engine has built in.
// If it has to fall back, say why, so a short list isn't mistaken for the real one.
async function fetchOrders() {
  const failed = [];
  for (const url of [API + "/api/orders", "orders.json"]) {
    try {
      const r = await fetch(url, { signal: AbortSignal.timeout(5000) });
      if (r.ok) return { orders: await r.json(), note: "" };
      failed.push(`${url} → HTTP ${r.status}`);
    } catch (e) {
      failed.push(`${url} → ${e.name === "TimeoutError" ? "timed out" : "blocked or unreachable"}`);
    }
  }
  const orders = window.TrackBotEngine.ORDERS;
  return { orders, note: `Couldn't load the full list (${failed.join("; ")}). Showing ${Object.keys(orders).length} built-in ` +
    `sample orders instead. Restart or redeploy the server with the latest code to see all of them.` };
}

function orderRow(id, rec) {
  const el = (tag, cls, text) => Object.assign(document.createElement(tag), { className: cls, textContent: text });
  const row = el("button", "orow");
  row.type = "button";
  row.title = "Look up " + id;
  const left = el("span", "oleft");
  left.append(el("span", "oid", id), el("span", "ostatus", rec.status));
  const details = Object.entries(rec).filter(([k]) => !["useCase", "status"].includes(k))
    .map(([k, v]) => k === "featured" ? "quick reply" : `${k}: ${v}`).join(" · ");
  const right = el("span", "oright");
  right.append(el("span", "ouse", rec.useCase || "(no description)"), el("span", "odet", details));
  row.append(left, right);
  row.onclick = () => { document.getElementById("thread").scrollIntoView({ block: "nearest" }); submit(id); };
  return row;
}

ordersToggle.onclick = async () => {
  ordersBox.hidden = !ordersBox.hidden;
  ordersToggle.textContent = ordersBox.hidden ? "view all orders" : "hide orders";
  ordersToggle.setAttribute("aria-expanded", String(!ordersBox.hidden));
  if (ordersBox.hidden || ordersShown) return;
  const { orders, note } = await fetchOrders();
  const noteBox = document.getElementById("ordersNote");
  noteBox.textContent = note;
  noteBox.hidden = !note;
  document.getElementById("ordersHead").textContent =
    `All test orders (${Object.keys(orders).length}) — click one to look it up in the chat`;
  orderList.replaceChildren(...Object.entries(orders).map(([id, rec]) => orderRow(id, rec)));
  ordersShown = true;
};

(async function start() {
  try {
    const tryServer = API || location.protocol.startsWith("http");
    backend = tryServer ? await serverBackend() : await localBackend();
  } catch {
    backend = await localBackend();   // page served without our API — still works
  }
  modeTag.textContent = backend.label;
  modeTag.classList.toggle("agent", backend.agent);
  render(backend.greeting);
})();
</script>
</body>
</html>
